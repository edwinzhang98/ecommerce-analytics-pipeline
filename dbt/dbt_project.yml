name: olist_analytics
version: "1.0.0"
config-version: 2
profile: olist_analytics

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["models", "docs"]
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Business rules that analysts may want to tune live in one place.
  bad_review_max_score: 2            # a review with score <= 2 counts as "bad"
  payment_mismatch_tolerance_brl: 1.00
  # Incremental fct_order_items re-processes this many days before the latest loaded purchase.
  fct_order_items_lookback_days: 3

models:
  olist_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  olist_analytics:
    +schema: seeds

data_tests:
  olist_analytics:
    +schema: test_failures
