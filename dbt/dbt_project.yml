name: olist_analytics
version: "1.0.0"
config-version: 2
profile: olist_analytics

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
docs-paths: ["models", "docs"]
clean-targets: ["target", "dbt_packages"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Business rules that analysts may want to tune live in one place.
  bad_review_max_score: 2            # a review with score <= 2 counts as "bad"
  payment_mismatch_tolerance_brl: 1.00
  # Incremental fct_order_items re-processes this many days before the latest loaded purchase.
  fct_order_items_lookback_days: 3
  # Months with complete order coverage (2016 and Sep-Oct 2018 are partial, see the DQ report).
  complete_data_start_month: "2017-01"
  complete_data_end_month: "2018-08"
  # Coverage guard used by tests/singular/assert_complete_months_have_expected_volume.sql
  min_net_orders_per_complete_month: 500

models:
  olist_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      +access: public   # the published interface: contracts enforced, safe to build on
  # Best-practice linter (naming, layering, coverage). Off in normal builds; CI enables it.
  dbt_project_evaluator:
    +enabled: "{{ var('run_project_evaluator', false) }}"

seeds:
  olist_analytics:
    +schema: seeds
    dbt_project_evaluator_exceptions:
      +enabled: "{{ var('run_project_evaluator', false) }}"
  dbt_project_evaluator:
    +enabled: "{{ var('run_project_evaluator', false) }}"
    dbt_project_evaluator_exceptions:
      +enabled: false

data_tests:
  olist_analytics:
    +schema: test_failures
  dbt_project_evaluator:
    +enabled: "{{ var('run_project_evaluator', false) }}"
