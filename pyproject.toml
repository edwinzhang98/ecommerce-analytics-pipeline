[project]
name = "olist-analytics"
version = "1.0.0"
description = "End-to-end analytics pipeline on the Olist e-commerce dataset: DuckDB + dbt marts, data-quality tests, docs and a Streamlit app."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    # warehouse + transformation
    "duckdb>=1.4,<3",
    "dbt-core>=1.10,<1.13",
    "dbt-duckdb>=1.10,<1.12",
    # analysis + reporting
    "pandas>=2.2",
    "pyarrow>=17",
    "plotly>=6",
    "jinja2>=3.1",
    "pyyaml>=6",
    "python-dotenv>=1",
    # app
    "streamlit>=1.40",
    # notebooks (executed by `make notebooks`)
    "jupyter>=1",
    "nbconvert>=7",
    "nbformat>=5",
    "ipykernel>=6",
]

[dependency-groups]
# Only needed to regenerate the README screenshots (`make screenshots`).
screenshots = ["playwright>=1.45"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olist_analytics"]

[tool.uv]
default-groups = []
